name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build -p ntfs-cli --release
      - run: bash scripts/build-golden-images.sh

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      - run: cargo test -p ntfs-core -p ntfs-io -p ntfs-vfs
      - run: cargo build -p ntfs-fuse --features fuse
